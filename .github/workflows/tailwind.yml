name: Regenerar tailwind.css

# Cuando un PR cambia el HTML (o la config de Tailwind), esta tarea recompila tailwind.css
# y, si cambió, lo sube a la misma rama del PR. Así nadie tiene que acordarse de compilar.
# Solo corre en PR de este mismo repositorio (no en forks).
on:
  pull_request:
    paths:
      - '*.html'
      - 'indicadores.js'
      - 'tailwind.config.js'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: tailwind-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compilar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:css

      - name: Subir tailwind.css si cambió
        run: |
          if [ -n "$(git status --porcelain tailwind.css)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tailwind.css
            git commit -m "Actualizar tailwind.css"
            git push
          else
            echo "tailwind.css ya está al día."
          fi

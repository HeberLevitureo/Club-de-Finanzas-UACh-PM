name: Actualizar indicadores financieros

# Publica indicadores.json en la rama "datos" (no toca main ni dispara un deploy).
on:
  schedule:
    # Cada 30 minutos en horario de mercado (lunes a viernes, 09:00–19:30 aprox. hora de Chile)
    - cron: '7,37 12-22 * * 1-5'
    # Una vez al día el fin de semana (bitcoin sigue transando)
    - cron: '7 14 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indicadores
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar cotizaciones
        run: node scripts/actualizar-indicadores.mjs salida

      - name: Publicar en la rama datos
        working-directory: salida
        run: |
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicadores.json
          git commit -q -m "Indicadores $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos

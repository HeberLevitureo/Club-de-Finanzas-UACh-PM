name: Sonda de fuentes (temporal)
on:
  push:
    branches: [indicadores-financieros]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prueba normal
        run: node scripts/actualizar-indicadores.mjs salida && cat salida/indicadores.json
      - name: Prueba forzando el respaldo
        run: SIMULAR_FALLA_YAHOO=1 node scripts/actualizar-indicadores.mjs salida2 && cat salida2/indicadores.json

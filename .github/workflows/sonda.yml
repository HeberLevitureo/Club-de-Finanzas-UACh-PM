name: Sonda de fuentes (temporal)
on:
  push:
    branches: [indicadores-financieros]
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          echo "=== busqueda"; curl -sS -m 20 -A "$UA" 'https://query2.finance.yahoo.com/v1/finance/search?q=IPSA&quotesCount=10&newsCount=0' | python3 -c "import sys,json;[print(q.get('symbol'),'|',q.get('shortname'),'|',q.get('exchDisp'),'|',q.get('quoteType')) for q in json.load(sys.stdin).get('quotes',[])]" || true
          echo "=== busqueda2"; curl -sS -m 20 -A "$UA" 'https://query2.finance.yahoo.com/v1/finance/search?q=S%26P%20IPSA&quotesCount=10&newsCount=0' | python3 -c "import sys,json;[print(q.get('symbol'),'|',q.get('shortname'),'|',q.get('exchDisp'),'|',q.get('quoteType')) for q in json.load(sys.stdin).get('quotes',[])]" || true
          for s in '%5EIPSA' '%5ESPIPSA' '%5ESPCLXIPSA' 'IPSA.SN' '%5EIGPA' '%5ESPCLXIGPA' 'CLP%3DX'; do echo "=== yahoo $s"; curl -sS -m 20 -A "$UA" -w ' [HTTP %{http_code}]' "https://query2.finance.yahoo.com/v8/finance/chart/$s?range=5d&interval=1d" | head -c 420; echo; done
          echo "=== google"; curl -sS -m 20 -L -A "$UA" -w '[HTTP %{http_code}]' 'https://www.google.com/finance/quote/IPSA:INDEXBCS?hl=en' | grep -o 'data-last-price="[^"]*"\|data-last-normal-market-timestamp="[^"]*"\|\[HTTP [0-9]*\]\|IPSA[^<]\{0,60\}' | head -8 || true
          echo "=== cnbc"; curl -sS -m 20 -A "$UA" 'https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=.IPSA-CL%7C.SPCLXIPSA%7CIPSA-CL%7C.IGPA&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json' | head -c 500; echo
          echo "=== bolsa"; curl -sS -m 20 -A "$UA" -w '[HTTP %{http_code}]' 'https://www.bolsadesantiago.com/api/RV_Indices/getIndicesPrincipales' -X POST -H 'Content-Type: application/json' -d '{}' | head -c 500; echo
          echo "=== investing"; curl -sS -m 20 -A "$UA" -w '[HTTP %{http_code}]' 'https://api.investing.com/api/financialdata/1151/historical/chart/?interval=P1D&pointscount=60' -H 'domain-id: www' | tail -c 300; echo
          echo "=== marketwatch"; curl -sS -m 20 -A "$UA" -w '[HTTP %{http_code}]' 'https://www.marketwatch.com/investing/index/ipsa?countrycode=cl' | grep -o '<meta name="price" content="[^"]*"\|<meta name="priceChangePercent" content="[^"]*"\|<meta name="quoteTime" content="[^"]*"\|\[HTTP [0-9]*\]' | head -5 || true
          echo "=== wsj"; curl -sS -m 20 -A "$UA" -w '[HTTP %{http_code}]' 'https://www.cnbc.com/quotes/.IPSA' | grep -o '"last":"[^"]*"\|\[HTTP [0-9]*\]' | head -3 || true
